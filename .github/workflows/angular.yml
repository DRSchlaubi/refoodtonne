name: Angular Static Build & Deploy
on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Use Node.js 24.x
      uses: actions/setup-node@v4
      with:
        node-version: 24.x
        cache: 'npm'
    - name: Install dependencies
      run: npm ci
    - name: Build (production, static output)
      run: npx ng build --configuration production
    - name: Upload static site artifact
      uses: actions/upload-artifact@v4
      with:
        name: angular-dist
        path: dist/**
        retention-days: 7

  deploy:
    needs: build
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
    - name: Download build artifact
      uses: actions/download-artifact@v4
      with:
        name: angular-dist
        path: dist

    - name: Write SSH key and known_hosts
      env:
        SSH_PRIVATE_KEY_B64: ${{ secrets.HETZNER_SSH_KEY }}
        SFTP_HOST: ${{ secrets.HETZNER_HOST }}
      run: |
        mkdir -p ~/.ssh
        echo "$SSH_PRIVATE_KEY_B64" | base64 -d > ~/.ssh/id_ed25519
        chmod 600 ~/.ssh/id_ed25519
        ssh-keyscan -p 22 -H "$SFTP_HOST" >> ~/.ssh/known_hosts

    - name: Debug — raw SFTP connection test
      env:
        SFTP_USER: ${{ vars.HETZNER_USER }}
        SFTP_HOST: ${{ vars.HETZNER_HOST }}
      run: |
        sftp -v -P 22 -i ~/.ssh/id_ed25519 \
          -o UserKnownHostsFile=~/.ssh/known_hosts \
          "$SFTP_USER@$SFTP_HOST" <<< "bye"
    
    - name: Install lftp
      run: sudo apt-get update && sudo apt-get install -y lftp

    - name: Deploy via SFTP (lftp mirror)
      env:
        SFTP_USER: ${{ vars.HETZNER_SFTP_USER }}
        SFTP_HOST: ${{ vars.HETZNER_HOST }}
        SFTP_PASS: ${{ secrets.HETZNER_SFTP_PASSWORD }}
        REMOTE_PATH: ${{ vars.HETZNER_REMOTE_PATH }}
      run: |
         lftp -u "$SFTP_USER,$SFTP_PASS" -e "mirror -R --delete --verbose dist/refood-tonne/browser/ $REMO
         TE_PATH; bye" sftp://$SFTP_USER@$SFTP_HOST:22
